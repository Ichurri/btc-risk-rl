[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "btc-risk-rl"
version = "0.1.0"
description = "Reproducible research infrastructure for risk-sensitive Bitcoin RL"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<3", "pydantic>=2.9,<3", "gymnasium>=1.0,<2"]

[project.scripts]
btc-risk = "btc_risk_rl.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
